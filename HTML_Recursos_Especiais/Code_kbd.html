<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code , KBD</title>
    
    <style>

        kbd {
            border: solid 1px black;
        }

        pre{
            background: #f1f1f1;
        }

        pre > p{ 
            font-style: italic;
            color: gray;
            padding-left: 30px;
        }

    </style>
</head>
<body>
    
    <p>Para copiar esta informação pressione <kbd>CTRL</kbd> + <kbd>C</kbd></p>

    <p>Para trocar o fundo de um elemento utilize o comando <code>backgrounder-color</code></p>

    <pre>
    <p>Comando completo de alterar a cor de fundo</p>

    

        <code>
            code { 
                background - color : #f1f1f1;
                color: red;
            }
        </code>

    </pre>

</body>
</html>
